name: build-desktop

# Builds the downloadable GRIDPULSE Desktop installers and attaches them
# to a GitHub Release.
# - Windows (NSIS installer) on windows-latest
# - macOS (DMG + zip) for Apple Silicon (arm64)
# Note: Intel (x64) macOS installers are no longer buildable on GitHub-hosted
# runners (macos-13 images were retired); macOS build targets arm64 only.
# Trigger: push a tag like v1.0.0 (or run manually from the Actions tab;
# manual runs from main attach to the v1.0.0 release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web frontend
        run: npm run build

      - name: Build Windows installer
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist:win

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || 'v1.0.0' }}
          files: desktop/release/*.exe
          fail_on_unmatched_files: false

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web frontend
        run: npm run build

      - name: Build macOS installer
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --mac dmg zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || 'v1.0.0' }}
          files: desktop/release/*.{dmg,zip}
          fail_on_unmatched_files: false