name: build-desktop

# Builds the downloadable GRIDPULSE Desktop installers and publishes them to
# a GitHub Release via electron-builder's GitHub publisher. electron-builder
# uploads the installers plus the latest*.yml metadata and *.blockmap files
# that the in-app auto-updater (electron-updater) needs to ship updates
# without requiring users to re-download.
# - Windows (NSIS installer) on windows-latest
# - macOS (DMG + zip) for Apple Silicon (arm64)
#
# macOS auto-update (electron-updater) requires a code-signed + notarized
# build. When the following Repository secrets are set, the macOS job signs
# and notarizes automatically:
#   CSC_LINK, CSC_KEY_PASSWORD              (signing certificate + password)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  (notarization)
# If they are not set, the macOS job still produces a manual-install build,
# but background auto-update on macOS stays disabled.
#
# CSC_LINK can be a path, an https: URL, or a base64-encoded .p12 string;
# electron-builder decodes these natively, so no keychain import is needed.
#
# Trigger: push a tag like v1.0.0 (or run manually from the Actions tab).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Auto-discovery is disabled globally so builds never pick up ad-hoc/self
# certs. Signing is explicit via the CSC_LINK secret in the macOS job.
env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web frontend
        run: npm run build

      - name: Build & publish Windows installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis zip --publish always

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web frontend
        run: npm run build

      - name: Build, sign & notarize macOS installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub renders absent secrets as EMPTY STRINGS, never "unset".
          # electron-builder treats a present-but-empty CSC_LINK as a
          # certificate file path and resolves it against the working dir,
          # dying with "desktop not a file". So stage secrets under _RAW
          # aliases and only export the real env vars when they are set.
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm install --no-audit --no-fund
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ -n "$CSC_LINK_RAW" ]; then
            export CSC_LINK="$CSC_LINK_RAW"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_RAW"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          fi
          if [ -n "$APPLE_ID_RAW" ]; then
            export APPLE_ID="$APPLE_ID_RAW"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_RAW"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_RAW"
          fi
          npx electron-builder --mac dmg zip --publish always
