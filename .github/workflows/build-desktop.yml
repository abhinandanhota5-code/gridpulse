name: build-desktop

# Builds the downloadable GRIDPULSE Desktop installers and publishes them to
# a GitHub Release via electron-builder's GitHub publisher. electron-builder
# uploads the installers plus the latest*.yml metadata and *.blockmap files
# that the in-app auto-updater (electron-updater) needs to ship updates
# without requiring users to re-download.
# - Windows (NSIS installer) on windows-latest
# - macOS (DMG + zip) for Apple Silicon (arm64)
# Note: macOS auto-update requires a code-signed + notarized build; this
# workflow builds unsigned (CSC_IDENTITY_AUTO_DISCOVERY=false), which keeps
# manual installs working but disables macOS background auto-update.
# Trigger: push a tag like v1.0.0 (or run manually from the Actions tab).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web frontend
        run: npm run build

      - name: Build & publish Windows installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis zip --publish always

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web frontend
        run: npm run build

      - name: Build & publish macOS installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --mac dmg zip --publish always
