services:
  - type: web
    name: gridpulse
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: INGEST_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false